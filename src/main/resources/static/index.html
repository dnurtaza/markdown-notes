<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Markdown Notes</title>
    <style>
        body { font-family: sans-serif; max-width: 700px; margin: 40px auto; padding: 0 16px; }
        section { border: 1px solid #ccc; border-radius: 8px; padding: 16px; margin-bottom: 20px; }
        textarea { width: 100%; height: 200px; font-family: monospace; box-sizing: border-box; }
        input[type=text] { width: 100%; box-sizing: border-box; margin-bottom: 8px; }
        #result { white-space: pre-wrap; background: #f5f5f5; padding: 12px; border-radius: 8px; }
    </style>
</head>
<body>
<h1>Markdown Notes</h1>

<section>
    <h2>Upload a file</h2>
    <input type="file" id="file" accept=".md">
    <button id="uploadBtn">Upload</button>
</section>

<section>
    <h2>Write a note</h2>
    <input type="text" id="title" placeholder="Title (optional)">
    <textarea id="content" placeholder="# My note"></textarea>
    <button id="saveBtn">Save</button>
</section>

<div id="result" hidden></div>
<p id="links" hidden></p>

<p><a href="/notes">All notes (JSON)</a></p>

<script>
    const result = document.getElementById('result');
    const links = document.getElementById('links');

    async function send(url, options) {
        const response = await fetch(url, { method: 'POST', ...options });
        const data = await response.json();

        result.hidden = false;
        if (response.ok) {
            result.textContent = 'Saved: "' + data.title + '" (id ' + data.id + ')';
            links.hidden = false;
            links.innerHTML = '';
            addLink('View HTML', '/notes/' + data.id + '/html');
            addLink('Check grammar', '/notes/' + data.id + '/grammar');
        } else {
            result.textContent = 'Error ' + data.status + ': ' + data.detail;
            links.hidden = true;
        }
    }

    function addLink(text, href) {
        const a = document.createElement('a');
        a.textContent = text;
        a.href = href;
        a.target = '_blank';
        links.append(a, ' ');
    }

    document.getElementById('uploadBtn').onclick = () => {
        const file = document.getElementById('file').files[0];
        if (!file) return;
        const form = new FormData();
        form.append('file', file);
        send('/notes', { body: form });
    };

    document.getElementById('saveBtn').onclick = () => {
        const title = document.getElementById('title').value || 'untitled';
        send('/notes?title=' + encodeURIComponent(title), {
            headers: { 'Content-Type': 'text/markdown; charset=UTF-8' },
            body: document.getElementById('content').value
        });
    };
</script>
</body>
</html>
